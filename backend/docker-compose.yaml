services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - 5000:5000
    depends_on:
      - wait
    restart: unless-stopped
    command: > 
      sh -c "
      npm run init-postgres-db &&
      npm run init-qdrant &&
      npm start
      "
  wait:
    image: jwilder/dockerize
    depends_on:
      - postgres
      - qdrant
    command: >
      dockerize
      -wait tcp://postgres:5432
      -wait tcp://qdrant:6333
      -timeout 60s

  postgres:
    image: postgres
    container_name: mindfeed_psql
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=mindfeed 
      - POSTGRES_USER=postgres
      - POSTGRES_DB=mindfeed_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
  qdrant:
    image: qdrant/qdrant
    container_name: mindfeed_qdrant
    ports:
      - 6333:6333
    volumes:
      - qdrant_data:/qdrant/storage  
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - 9090:9090
    volumes:
      - ../prometheus.yml:/etc/prometheus/prometheus.yml
volumes:
  postgres_data:
  qdrant_data: